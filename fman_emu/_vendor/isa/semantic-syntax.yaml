schema_version: 1
name: semantic
description: Canonical semantic assembly forms. Encoding-specific mnemonics remain in encodings.yaml and the former
  short display names remain compatibility data; neither is part of this frontend.
deprecated_mnemonics:
  bfi32:
    replacement: bfins32
    message: bfi32 is deprecated; use bfins32 destination, source, rotate, high_trim, low_bound
decorators:
- name: discard
  kind: behavior
  description: Compute the operation's result without writing a scalar destination.
- name: publish
  kind: behavior
  description: Replace the documented result predicates from the computed result.
- name: carry
  kind: behavior
  description: Consume predicate p0 as an incoming carry bit; rotate-through-carry forms also produce a new p0 when
    documented.
- name: borrow
  kind: behavior
  description: Subtract predicate p0 as an incoming borrow without implying predicate publication.
- name: increment
  kind: behavior
  description: Select the encoded constant one as the arithmetic carry-in.
- name: decrement
  kind: behavior
  description: Select the encoded constant one as the arithmetic borrow-in.
- name: reverse
  kind: behavior
  description: Complement a five-bit bit index or shift count, using 31 minus the supplied value modulo 32.
- name: swap8
  kind: behavior
  description: Swap the two bytes within each 16-bit half of the computed result.
- name: bswap
  kind: behavior
  description: Reverse the four bytes of the computed result.
- name: bitrev8
  kind: behavior
  description: Reverse the bit order independently within each result byte.
- name: rol16
  kind: behavior
  description: Rotate the computed result left by 16 bits.
- name: lsr8
  kind: behavior
  description: Shift the computed result right by eight bits.
- name: lsr1
  kind: behavior
  description: Shift the computed result right by one bit.
- name: low16
  kind: behavior
  description: Retain only the low 16 bits of the computed result.
- name: increment_count
  kind: behavior
  description: Add one modulo 32 to the register-supplied rotate count.
- name: descending
  kind: behavior
  description: Traverse the configured source and destination ranges from their endpoints toward lower addresses.
- name: select
  kind: behavior
  description: Select or suppress the operation result according to the named predicate and polarity.
- name: next
  kind: behavior
  description: Execute the following instruction once before completing the control transfer.
- name: encoding
  kind: encoding
  description: Select a behaviorally equivalent or not-yet-distinguished machine encoding for exact binary reproduction.
- name: raw
  prefix: true
  kind: encoding
  description: Preserve an encoded field whose positive architectural purpose is unresolved or absent.
